# Fixed study settings. Record any change after registration as a dated protocol amendment.

[checkpoint]
name = "facebook/wav2vec2-base"
revision = "0b5b8e868dd84f03fd87d01f9c4ff0f080fecfe8"

[corpus]
sessions = [1, 2, 3, 4, 5]
emotions = ["angry", "happy", "sad", "neutral"]

[seeds]
confirmatory = [20270101, 20270102, 20270103]
# Teachers without an auxiliary weight compare these seeds. Other runs use the first seed.
tuning = [20270201, 20270202, 20270203]

[teacher_tuning]
# Each auxiliary loss is scaled to the emotion loss measured when the encoder starts training, after
# the heads-only phase, then multiplied by these values.
auxiliary_loss_scales = [0.01, 0.1, 1.0]
# Share of updates given to speech recognition by the sequential teacher.
asr_update_shares = [0.25, 0.5, 0.75]

[student]
primary_depth = 6
depths = [6, 4]

# Provisional values based on Gao et al. (Interspeech 2023): batch size 16, learning rate 1e-4
# (reported as "10e-5"), and about 100 passes through three sessions. Confirm them before
# registration.
[training]
batch_size = 16
learning_rate = 1e-4
teacher_updates = 20000
student_updates = 20000
validation_interval = 2000
gradient_log_interval = 500
max_gradient_norm = 1.0
# Random batches used to calibrate auxiliary loss weights (512 utterances).
calibration_batches = 32
# Fine-tuning schedule adapted from wav2vec 2.0 (Baevski et al., NeurIPS 2020, Section 4.3). In each
# training stage, only the task heads train for the first share of updates. The encoder then
# trains with a learning rate that warms up, holds, and decays linearly, in these shares of the
# remaining updates. A constant rate without these phases collapsed two of three pilot teachers.
head_only_share = 0.1
warmup_share = 0.1
hold_share = 0.4
# Efficiency settings that keep the method unchanged: bfloat16 mixed precision on a GPU, and
# batches of utterances with similar lengths, which reduces padding.
mixed_precision = true
group_batches_by_length = true

[distillation]
temperature = 2.0

[[distillation.candidates]]
logit_weight = 1.0
hidden_state_weight = 0.1

[[distillation.candidates]]
logit_weight = 1.0
hidden_state_weight = 1.0

[[distillation.candidates]]
logit_weight = 0.5
hidden_state_weight = 0.1
